[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/__pycache__", "**/*.zip"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # long lines flagged by formatter, not lint

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
