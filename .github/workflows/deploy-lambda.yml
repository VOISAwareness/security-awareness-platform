name: OIDC Debug

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Repository Info
        run: |
          echo "Repository=${{ github.repository }}"
          echo "Ref=${{ github.ref }}"
          echo "Actor=${{ github.actor }}"

      - name: Show OIDC Variables
        run: |
          echo "OIDC URL present:"
          echo "${ACTIONS_ID_TOKEN_REQUEST_URL}" | cut -c1-80