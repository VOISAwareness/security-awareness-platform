name: OIDC Debug

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Context
        run: |
          echo "Repository=${{ github.repository }}"
          echo "Ref=${{ github.ref }}"
          echo "Actor=${{ github.actor }}"

      - name: Show OIDC Variables
        run: |
          echo "OIDC URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          echo "OIDC TOKEN exists: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+YES}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::798299234472:role/GitHubActionsLambdaDeployRole
          aws-region: ap-south-1

      - name: Verify Identity
        run: |
          aws sts get-caller-identity