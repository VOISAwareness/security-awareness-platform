name: Deploy Lambdas

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::798299234472:role/GitHubActionsLambdaDeployRole
          aws-region: ap-south-1

      - name: Deploy campaign-reader
        run: |
          cd backend/campaign-reader
          zip lambda.zip lambda_function.py
          aws lambda update-function-code \
            --function-name security-awareness-poc-campaign-reader \
            --zip-file fileb://lambda.zip